name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The roadmap page fetches the latest release of each component repo at
  # build time. Those repos ship on their own cadence and can't trigger a
  # build here (GITHUB_TOKEN is scoped to its own repo, so cross-repo
  # dispatch would need a PAT in four places). A nightly rebuild keeps the
  # "Recently shipped" strip current within a day, with nothing to rotate.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write so the progress snapshot can push the progress-data
    # branch. main stays protected; nothing here writes to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Records tonight's board counts for the /roadmap progress chart and
      # writes src/data/progress-history.json for the build. Never fails the
      # deploy: without a key or with Plane down, the chart just waits.
      - name: Record roadmap progress
        run: node scripts/progress-snapshot.mjs --push
        env:
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}

      - name: Build
        run: npm run build
        env:
          # Lets the roadmap page's build-time release lookups use the
          # authenticated rate limit. Unauthenticated is 60/hr per IP and
          # Actions runners share addresses. The build tolerates a failure
          # here: the shipped strip just disappears.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Plane key for the /roadmap progress section. Titles,
          # states and dates only; the page never asks for descriptions.
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
